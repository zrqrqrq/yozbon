version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aijuhe-pg
    environment:
      POSTGRES_DB: aijuhe
      POSTGRES_USER: aijuhe
      POSTGRES_PASSWORD: aijuhe_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijuhe"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aijuhe-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
